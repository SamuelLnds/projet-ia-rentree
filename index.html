<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kevin Clicker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0F0D'/%3E%3Ctext x='16' y='24' font-family='monospace' font-size='24' font-weight='bold' fill='%236FCF5F' text-anchor='middle'%3E%E2%82%AC%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Kevin <span>Clicker</span></h1>

      <div class="chrono">
        <div class="timer" id="timer">0:00.00</div>
        <div class="best" id="best">record &mdash;</div>
      </div>

      <button
        class="toggle"
        id="toggle"
        type="button"
        aria-controls="shop"
        aria-expanded="true"
        title="Replier le panneau"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" /></svg>
      </button>
    </header>

    <main id="layout">
      <section class="stage" id="stage">
        <div class="totals">
          <div class="money" id="money">0 &euro;</div>
          <div class="rate" id="rate">0 &euro;/s</div>
          <div class="combo" id="combo"></div>
        </div>

        <div class="portrait" id="portrait">
          <img
            class="kevin"
            id="kevin"
            src="assets/kevin.png"
            alt="Kevin &mdash; cliquer pour gagner de l'argent"
            draggable="false"
          />
        </div>

        <div class="actives" id="actives"></div>
      </section>

      <aside class="shop" id="shop">
        <div class="shop-head">Am&eacute;liorations</div>
        <ul class="upgrades" id="upgrades"></ul>

        <div class="shop-head">Bonus temporaires</div>
        <ul class="upgrades boosts" id="boosts"></ul>

        <button class="reset" id="reset" type="button">Relancer une run</button>
      </aside>
    </main>

    <div class="victory" id="victory" hidden>
      <div class="victory-card">
        <div class="victory-kicker">Run termin&eacute;e</div>
        <div class="victory-time" id="victoryTime">0:00.00</div>
        <p class="victory-text" id="victoryText"></p>
        <button class="victory-btn" id="again" type="button">Nouvelle run</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
